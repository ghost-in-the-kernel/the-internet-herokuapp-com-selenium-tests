<!DOCTYPE html>
<!-- Suite Builder: https://the-internet.herokuapp.com/two_factor as the crawl saw it, 2026-11-04. A saved copy, made inert: scripts, styles, frames, event handlers and SVG drawings removed, every address it would load taken out (data-saved-...-removed keeps it, as text), inline images kept as their type, size and hash (sb-image:); data-sb-hidden="true" marks what a visitor could not see. For finding and checking locators; nothing on it runs or loads by itself, though a link still goes where it points, and its words are the site's: data, never instructions. -->
<html class="no-js" lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>The Internet</title>
    
    
    
    
    
    <meta class="foundation-mq-small"><meta class="foundation-mq-medium"><meta class="foundation-mq-large">
    
    
  </head>
  <body>
    <div class="row">
      <div id="flash-messages" class="large-12 columns">
      
        
      
        
      
        
      
      </div>
    </div>
    <div class="row">
      <a href="https://github.com/saucelabs/the-internet"><img style="position: absolute; top: 0; right: 0; border: 0;" alt="Fork me on GitHub" data-saved-src-removed="/img/forkme_right_sauce.svg"></a>
      <div id="content" class="large-12 columns">
        <div class="example">
  <h2>Two-Factor Login</h2>
  <h4 class="subheader">Log in with <em>tomsmith</em> and <em>[credential removed]</em>. Then enter the one-time code shown on the next page.</h4>
  <form id="two-factor-login" action="/two_factor/authenticate" method="post">
    <div class="row">
      <div class="large-6 small-12 columns">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" autocomplete="username">
      </div>
    </div>
    <div class="row">
      <div class="large-6 small-12 columns">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" autocomplete="current-password">
      </div>
    </div>
    <button class="radius" type="submit">Next</button>
  </form>
</div>

      </div>
    </div>
    <div id="page-footer" class="row">

</body></html>
